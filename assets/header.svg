<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="850" height="170">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d11"/>
      <stop offset="50%" stop-color="#14161f"/>
      <stop offset="100%" stop-color="#1a1c29"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="166" rx="16" fill="url(#bg)" stroke="#27272a" stroke-width="1.5"/>
  <rect x="200" y="2" width="450" height="2" fill="url(#glow)"/>

  <!-- Main Title -->
  <text x="425" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.02em" fill="url(#titleGrad)">Logachandran K M</text>

  <!-- Subtitle -->
  <text x="425" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="0.06em" fill="#71717A">SOFTWARE ENGINEER • FULL-STACK • LLMs &amp; CLOUD SYSTEMS</text>

  <!-- Feature Tags -->
  <g transform="translate(185, 118)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="145" height="26" rx="13" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="72" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E4E4E7">Full-Stack Web</text>

    <!-- Tag 2 -->
    <rect x="155" y="0" width="165" height="26" rx="13" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="237" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E4E4E7">LLM Architectures &amp; Agents</text>

    <!-- Tag 3 -->
    <rect x="330" y="0" width="150" height="26" rx="13" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="405" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="600" fill="#E4E4E7">Cloud &amp; DevOps</text>
  </g>
</svg>
